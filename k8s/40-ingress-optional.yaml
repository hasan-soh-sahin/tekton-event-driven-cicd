# OPTIONAL: requires an installed Ingress controller, external DNS and TLS secret.
# For local tests use kubectl port-forward instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: image-build-webhook
  namespace: data-platform-ci
spec:
  ingressClassName: nginx
  tls:
    - hosts: [tekton.example.com]
      secretName: tekton-webhook-tls
  rules:
    - host: tekton.example.com
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: el-image-build-listener
                port:
                  number: 8080
